server.port=8081
spring.application.name=consumer-processing
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-processing-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.kafkaorder.processing.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafkaorder.processing.event.OrderCreatedEvent